name: Deploy to GCP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code from GitHub
        uses: actions/checkout@v4

      # 🛡️ เพิ่มขั้นตอนตรวจสอบความปลอดภัย (Security Check) ตรงนี้
      # ตัวอย่างเช่น การสแกนหา Secret หรือรหัสผ่านที่เผลอหลุดมากับโค้ด
      - name: Run TruffleHog Secret Scanning
        uses: trufflehog/trufflehog-actions@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}

      # ส่งไฟล์ขึ้นเซิร์ฟเวอร์ (จะทำต่อเมื่อผ่านการสแกนความปลอดภัยด้านบนแล้วเท่านั้น)
      - name: Copy files to GCP via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_PRIVATE_KEY }}
          source: "index.html"
          target: "/var/www/html/"