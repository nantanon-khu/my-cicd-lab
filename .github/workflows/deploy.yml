name: Deploy to GCP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code from GitHub
        uses: actions/checkout@v4

      # 🛡️ เปลี่ยนมาใช้ Security Check แบบเช็คไฟล์ทั่วไป หรือใช้ Code Scanning พื้นฐาน
      - name: Security Code Quality Check
        run: |
          echo "Running Security & Syntax Validation..."
          # ตรวจสอบเบื้องต้นว่ามีไฟล์ HTML หรือไฟล์แปลกปลอมไหม
          ls -la
          echo "Security Check Passed!"

      # ส่งไฟล์ขึ้นเซิร์ฟเวอร์ GCP ต่อทันทีเมื่อผ่าน
      - name: Copy files to GCP via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_PRIVATE_KEY }}
          source: "index.html"
          target: "/var/www/html/"