<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompTIA Security+ Exam Simulator V3</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e293b;
            --secondary-color: #2563eb;
            --bg-color: #f1f5f9;
            --text-color: #334155;
            --correct-bg: #dcfce7;
            --correct-border: #22c55e;
            --correct-text: #166534;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .header .status {
            font-size: 1.1rem;
            font-weight: 500;
            background: rgba(255,255,255,0.15);
            padding: 6px 16px;
            border-radius: 20px;
        }

        /* Upload Area */
        #upload-container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            border: 2px dashed #cbd5e1;
        }

        #upload-container input[type="file"] {
            display: block;
            margin: 20px auto;
            font-size: 1.1rem;
            font-family: 'Kanit', sans-serif;
            padding: 10px;
            background: #f8fafc;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Exam Area */
        .card {
            background-color: var(--card-bg);
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .question-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--secondary-color);
            margin-top: 0;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .choice {
            padding: 15px 20px;
            margin-bottom: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background-color: #f8fafc;
            font-size: 1.05rem;
        }

        .choice.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-border);
            color: var(--correct-text);
            font-weight: 500;
            box-shadow: 0 2px 5px rgba(34, 197, 94, 0.2);
        }

        .explanation {
            margin-top: 35px;
            padding: 20px 25px;
            background-color: #f1f5f9;
            border-left: 5px solid var(--secondary-color);
            border-radius: 0 8px 8px 0;
        }

        .explanation h4 {
            margin-top: 0;
            color: var(--secondary-color);
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 20px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            flex-wrap: wrap;
            gap: 15px;
        }

        button {
            font-family: 'Kanit', sans-serif;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover:not(:disabled) {
            opacity: 0.9;
            background-color: var(--secondary-color);
        }

        button:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .jump-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .jump-box input {
            font-family: 'Kanit', sans-serif;
            padding: 10px 15px;
            width: 80px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
            text-align: center;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Domain: CompTIA Security+ SY0-701</h1>
            <div class="status" id="status-text">รออัปโหลดข้อสอบ...</div>
        </div>

        <!-- หน้าอัปโหลดไฟล์ -->
        <div id="upload-container">
            <h2>อัปโหลดไฟล์ข้อสอบของคุณ (V3)</h2>
            <p>1. ก๊อปปี้ข้อสอบทั้งหมดไปวางใน Notepad แล้ว Save เป็นไฟล์ <b>.txt</b><br>
               2. กดปุ่มด้านล่างเพื่ออัปโหลดไฟล์ <b>.txt</b> นั้นเข้าสู่ระบบครับ</p>
            <input type="file" id="file-input" accept=".txt" />
        </div>

        <!-- Exam Area -->
        <div class="card" id="exam-container" style="display:none;">
            <h3 class="question-title" id="q-title"></h3>
            <div class="question-text" id="q-text"></div>
            
            <div id="choices-container"></div>
            
            <div class="explanation" id="explanation-container">
                <h4>คำอธิบายเหตุผล</h4>
                <div id="explanation-text"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls" id="controls-container" style="display:none;">
            <button id="btn-back">◄ ย้อนกลับ</button>
            <div class="jump-box">
                <input type="number" id="jump-input" placeholder="เลขข้อ">
                <button id="btn-jump" style="background-color: #64748b;">ไป (Jump)</button>
            </div>
            <button id="btn-next">ถัดไป ►</button>
        </div>
    </div>

    <script>
        let questionsList = [];
        let currentIndex = 0;

        // ระบบอ่านไฟล์
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                processText(text);
            };
            reader.readAsText(file);
        });

        // ฟังก์ชันประมวลผลข้อความ (แก้บั๊กรวบยอดข้อสอบเรียบร้อยแล้ว!)
        function processText(text) {
            const normalizedText = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            const lines = normalizedText.split('\n');
            
            const questions = [];
            let currentQ = null;
            let phase = 'q'; 

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                // จับหมายเลขข้อ (รองรับทั้ง "คำถาม 1" และ "531.")
                const qMatch = line.match(/^(?:คำถาม(?:ที่)?\s*(\d+)|^(\d+)\.\s)/);
                
                // ถ้านี่คือบรรทัดที่บอกเลขข้อใหม่ ให้สร้าง Object ใหม่ทันที!
                if (qMatch) {
                    let parsedId = parseInt(qMatch[1] || qMatch[2]);
                    let isNewQuestion = false;

                    // เช็คว่าเป็นข้อใหม่จริงๆ ใช่ไหม (ป้องกันการเจอเลขข้อหลอกในคำอธิบาย)
                    if (!currentQ) {
                        isNewQuestion = true;
                    } else if (line.startsWith("คำถาม")) {
                        isNewQuestion = true;
                    } else if (parsedId > currentQ.id) {
                        isNewQuestion = true;
                    }

                    if (isNewQuestion) {
                        if (currentQ) questions.push(currentQ);
                        
                        let cleanedLine = line.replace(/^(?:คำถาม(?:ที่)?\s*\d+\s*\(.*?\)\s*|\d+\.\s*)/, '');
                        
                        currentQ = {
                            id: parsedId,
                            text: cleanedLine ? cleanedLine + '<br>' : '',
                            choices: [],
                            correctLetters: [],
                            explanation: ''
                        };
                        phase = 'q';
                        continue;
                    }
                }

                if (!currentQ) continue;

                // จับตัวเลือก (a. b. c. d.)
                const cMatch = line.match(/^([a-z])\.\s/i);
                if (cMatch && phase !== 'e') {
                    phase = 'c';
                    currentQ.choices.push({
                        letter: cMatch[1].toLowerCase(),
                        text: line
                    });
                    continue;
                }

                // จับเฉลยและคำอธิบาย
                if (line.match(/^(เฉลย|คำอธิบาย|เหตุผล)/)) {
                    phase = 'e';
                    if (line.startsWith('เฉลย:')) {
                        const lettersMatch = line.match(/([a-z])\./ig);
                        if (lettersMatch) {
                            currentQ.correctLetters = lettersMatch.map(m => m.replace('.', '').toLowerCase());
                        }
                    }
                    currentQ.explanation += line + '<br><br>';
                    continue;
                }

                // เก็บข้อความต่อท้าย
                if (phase === 'q') {
                    currentQ.text += line + '<br>';
                } else if (phase === 'e') {
                    currentQ.explanation += line + '<br>';
                } else if (phase === 'c') {
                    if(currentQ.choices.length > 0) {
                        currentQ.choices[currentQ.choices.length - 1].text += ' ' + line;
                    }
                }
            }
            
            if (currentQ) questions.push(currentQ);
            
            if (questions.length > 1) {
                questionsList = questions.sort((a, b) => a.id - b.id);
                alert("🎉 โหลดสำเร็จ! ระบบสแกนพบข้อสอบทั้งหมด " + questionsList.length + " ข้อครับ!");
                document.getElementById('upload-container').style.display = 'none';
                document.getElementById('exam-container').style.display = 'block';
                document.getElementById('controls-container').style.display = 'flex';
                renderQuestion(0);
            } else if (questions.length === 1) {
                alert("ระบบเจอปัญหาครับ! มันรวบข้อสอบทั้งหมดกลายเป็นข้อ 1 ข้อเดียวเลย (ไม่มีหน้า 2) ลองเช็คการเว้นบรรทัดในไฟล์ Text ดูนะครับ");
            } else {
                alert("อ่านไฟล์ไม่สำเร็จครับ ไม่พบข้อสอบเลย");
            }
        }

        // ฟังก์ชันแสดงข้อสอบ
        function renderQuestion(index) {
            const q = questionsList[index];
            document.getElementById('q-title').innerText = "ข้อที่ " + q.id;
            document.getElementById('q-text').innerHTML = q.text;
            
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';
            
            q.choices.forEach(c => {
                const choiceDiv = document.createElement('div');
                choiceDiv.className = 'choice';
                if (q.correctLetters.includes(c.letter)) {
                    choiceDiv.classList.add('correct');
                }
                choiceDiv.innerText = c.text;
                choicesContainer.appendChild(choiceDiv);
            });

            document.getElementById('explanation-text').innerHTML = q.explanation;
            document.getElementById('status-text').innerText = "สถานะ: ข้อ " + q.id + " / " + questionsList.length;

            document.getElementById('btn-back').disabled = (index === 0);
            document.getElementById('btn-next').disabled = (index === questionsList.length - 1);
            document.getElementById('jump-input').value = q.id;
        }

        // ปุ่มควบคุม
        document.getElementById('btn-next').addEventListener('click', () => {
            if (currentIndex < questionsList.length - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        document.getElementById('btn-back').addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        document.getElementById('btn-jump').addEventListener('click', () => {
            const jumpVal = parseInt(document.getElementById('jump-input').value);
            const targetIndex = questionsList.findIndex(q => q.id === jumpVal);
            if (targetIndex !== -1) {
                currentIndex = targetIndex;
                renderQuestion(currentIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                alert("ไม่พบข้อ " + jumpVal + " ในระบบครับ");
            }
        });

        document.getElementById('jump-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') document.getElementById('btn-jump').click();
        });
    </script>
</body>
</html>
