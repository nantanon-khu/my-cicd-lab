<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Server FMA v4.3.1.1</title>
    
    <!-- ใช้งาน Bootstrap CSS และ FontAwesome ตามต้นฉบับจริง -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            padding-top: 10px;
            padding-left: 10px;
            background-color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }
        
        .server-title {
            font-size: 13pt;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .preIconInput {
            position: absolute;
            left: 2em;
            top: .65em;
            opacity: .7;
        }

        input[type="text"], input[type="password"] {
            padding: 1.4em 0em 1.4em 4em;
            border-radius: 3em;
            background-color: #E6E6E6;
            border: none;
        }

        .fa {
            color: #666;
        }

        #btnSubmit {
            background-color: #57b846;
            font-weight: bold;
            border-radius: 3em;
            transition: all .4s;
            border: none;
        }

        #btnSubmit:hover {
            background-color: #333;
        }
    </style>
</head>
<body class="mainFrame_bg">

    <!-- หัวข้อเวอร์ชันระบบตามภาพ -->
    <div class="server-title">Server FMA v4.3.1.1</div>

    <div class="container mt-4 p-0 ml-0" style="max-width: 300px;">
        <div class="mb-3 ml-2">Login</div>
        <form method="post" id="Form1">

            <!-- ช่องกรอกรหัสพนักงาน (Employee code) -->
            <div class="form-group mb-3">
                <div class="position-relative">
                    <span class="preIconInput"><i class="fa fa-user"></i></span>
                    <input name="EmpText" type="text" id="EmpText" class="form-control" placeholder="Employee code" value="82000458" required="">
                </div>
            </div>

            <!-- ช่องกรอกรหัสผ่าน (Password) -->
            <div class="form-group mb-2">
                <div class="position-relative">
                    <span class="preIconInput"><i class="fa fa-lock"></i></span>
                    <input name="EmpPassword" type="password" id="EmpPassword" class="form-control" placeholder="Password" value="secretpassword" required="">
                </div>
            </div>

            <!-- ปุ่ม LOGIN สีเขียวโค้งมน -->
            <div class="form-group mb-3">
                <span id="lblError" class="text-danger"></span>
                <input type="submit" name="btnSubmit" value="LOGIN" id="btnSubmit" class="btn btn-success btn-block py-2 mt-3">
            </div>

        </form>
    </div>

</body>
</html>
