<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERPUNK MATRIX - Phod Pho</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #020205;
            font-family: 'Share Tech Mono', monospace;
            color: #00ffcc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ตารางเส้นกริดไซเบอร์พื้นหลัง */
        .cyber-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 255, 204, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg);
            animation: gridMove 20s linear infinite;
            z-index: -2;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
        }

        /* แสงนีออนสไตล์เรฟโวลูชันหมุนวน */
        .neon-orb-1, .neon-orb-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.6;
        }

        .neon-orb-1 {
            width: 350px;
            height: 350px;
            background: #ff007f;
            top: 10%;
            left: 20%;
            animation: floatOrb1 8s ease-in-out infinite alternate;
        }

        .neon-orb-2 {
            width: 400px;
            height: 400px;
            background: #00ffcc;
            bottom: 10%;
            right: 20%;
            animation: floatOrb2 10s ease-in-out infinite alternate;
        }

        @keyframes floatOrb1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 50px) scale(1.2); }
        }

        @keyframes floatOrb2 {
            0% { transform: translate(0, 0) scale(1.2); }
            100% { transform: translate(-70px, -60px) scale(0.9); }
        }

        /* กล่องโฮโลแกรมกระจกแก้วใส */
        .hologram-box {
            background: rgba(3, 7, 18, 0.75);
            backdrop-filter: blur(12px);
            border: 2px solid #00ffcc;
            border-radius: 16px;
            padding: 45px;
            width: 480px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3),
                        inset 0 0 20px rgba(0, 255, 204, 0.2);
            position: relative;
            clip-path: polygon(0 0, 95% 0, 100% 8%, 100% 100%, 5% 100%, 0 92%);
        }

        /* มุมตัดเท่ๆ แบบไซเบอร์ */
        .hologram-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 3px;
            background: linear-gradient(90deg, #ff007f, #00ffcc, #ff007f);
            animation: scanline 3s linear infinite;
        }

        @keyframes scanline {
            0% { background-position: 0 0; }
            100% { background-position: 480px 0; }
        }

        .system-tag {
            font-family: 'Orbitron', sans-serif;
            background: rgba(255, 0, 127, 0.2);
            color: #ff007f;
            border: 1px dashed #ff007f;
            padding: 6px 14px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: inline-block;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #a7f3d0;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* ปุ่มนีออนกระพริบระเบิดแสง */
        .cyber-btn {
            background: transparent;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 14px 35px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            transition: all 0.4s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
        }

        .cyber-btn:hover {
            background: #00ffcc;
            color: #020205;
            box-shadow: 0 0 30px #00ffcc, 0 0 60px #00ffcc;
            transform: translateY(-3px);
        }

        .metrics {
            margin-top: 35px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(0, 255, 204, 0.2);
            padding-top: 20px;
            font-size: 0.9rem;
            color: #6ee7b7;
        }

        .metric-value {
            color: #ff007f;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
        }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>
    <div class="neon-orb-1"></div>
    <div class="neon-orb-2"></div>

    <div class="hologram-box">
        <div class="system-tag">DEVSECOPS // ACTIVE_SECURE</div>
        <h1>PHOD PHO</h1>
        <div class="subtitle">SECURITY MATRIX & CI/CD PIPELINE ONLINE</div>
        
        <a href="https://github.com/nantanon-khu" target="_blank" class="cyber-btn">ACCESS CORE</a>

        <div class="metrics">
            <div>GATEWAY: <span class="metric-value">SECURE</span></div>
            <div>STATUS: <span class="metric-value">100%</span></div>
        </div>
    </div>

</body>
</html>
