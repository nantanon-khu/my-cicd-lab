<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk CI/CD Portal - Phod Pho</title>
    <!-- นำเข้า Google Font สไตล์ล้ำๆ -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Prompt:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030712;
            font-family: 'Prompt', 'Orbitron', sans-serif;
            color: #f3f4f6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* เอฟเฟกต์แสงนีออนพื้นหลังแบบเคลื่อนไหว */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #3b82f6 0%, #ec4899 100%);
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
            animation: pulseGlow 6s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(-50px, -50px); opacity: 0.5; }
            100% { transform: scale(1.3) translate(50px, 50px); opacity: 0.8; }
        }

        /* กล่องดีไซน์กระจกฝ้า (Glassmorphism) */
        .glass-card {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 450px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8),
                        inset 0 0 15px rgba(255, 255, 255, 0.05);
            position: relative;
            animation: floatCard 4s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, #60a5fa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.3);
        }

        p {
            color: #9ca3af;
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* ปุ่มกดเรืองแสงล้ำๆ */
        .neon-btn {
            background: linear-gradient(135deg, #2563eb 0%, #db2777 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(219, 39, 119, 0.4);
            text-decoration: none;
            display: inline-block;
        }

        .neon-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.8),
                        0 0 10px rgba(219, 39, 119, 0.8);
        }

        .status-footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #4b5563;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="glass-card">
        <div class="badge">CI/CD Pipeline Active</div>
        <h1>PHOD PHO LAB</h1>
        <p>ระบบอัตโนมัติทำงานสมบูรณ์แบบ 100% ขับเคลื่อนด้วย GitHub Actions & GCP ปลอดภัยด้วยมาตรฐาน HTTPS</p>
        
        <a href="https://github.com/nantanon-khu" target="_blank" class="neon-btn">EXPLORE GITHUB</a>

        <div class="status-footer">
            <div class="dot"></div>
            <span>System Online & Secured by Let's Encrypt</span>
        </div>
    </div>

</body>
</html>
